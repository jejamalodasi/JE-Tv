<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JE TV</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<header>

<h1>📺 JE TV</h1>

<input
id="search"
type="text"
placeholder="Search Channel...">

</header>

<section id="banner">

Loading Banner...

</section>

<section id="categories">

<button class="active">

All

</button>

</section>

<section id="channels">

Loading Channels...

</section>

<div id="playerModal" class="hide">

<div class="playerHeader">

<span id="playerTitle">

JE TV

</span>

<button id="closePlayer">

✕

</button>

</div>

<video

id="player"

controls

playsinline

autoplay>

</video>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script src="app.js"></script>

</body>
</html>
