<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT FOR MOBILE -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08090b"
  >

  <meta
    name="description"
    content="JE TV - Live TV streaming platform"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>JE TV</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       JE TV MOBILE PLAYER FIX
       ========================= */

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body.player-open {
      overflow: hidden;
      position: fixed;
      width: 100%;
      left: 0;
      right: 0;
    }

    /* =========================
       BANNER
       ========================= */

    #banner {
      width: 100%;
      overflow: hidden;
    }

    .banner-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .banner-container img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: cover;
    }

    .banner-content {
      position: relative;
      width: 100%;
    }

    .banner-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       PLAYER MODAL
       ========================= */

    #playerModal {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100dvh;

      z-index: 999999;

      background: #000;

      display: flex;
      flex-direction: column;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      overflow: hidden;
    }

    #playerModal.hide {
      display: none !important;
    }

    .playerHeader {
      width: 100%;
      min-height: 52px;

      flex: 0 0 52px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;

      background: #08090b;
      color: #fff;

      z-index: 10;
    }

    #playerTitle {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 16px;
      font-weight: 600;
    }

    #closePlayer {
      flex: 0 0 auto;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: rgba(255,255,255,.12);
      color: #fff;

      font-size: 20px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #player {
      display: block;

      width: 100%;
      height: calc(100dvh - 52px);

      max-width: 100%;
      max-height: calc(100dvh - 52px);

      margin: 0;
      padding: 0;

      background: #000;

      object-fit: contain;

      outline: none;

      /* IMPORTANT */
      -webkit-playsinline: true;
    }

    /* =========================
       PLAYER ERROR
       ========================= */

    .player-error {
      position: absolute;

      left: 50%;
      bottom: 35px;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 500px;

      padding: 13px 16px;

      border-radius: 10px;

      background: rgba(20,20,20,.94);

      color: #fff;

      text-align: center;

      font-size: 14px;

      z-index: 20;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      header {
        width: 100%;
      }

      #banner {
        padding: 0 10px;
      }

      #playerModal {
        width: 100%;
        height: 100dvh;

        /* Never create desktop-sized layout */
        min-width: 0;
        max-width: 100vw;
      }

      .playerHeader {
        min-height: 50px;
        flex-basis: 50px;
      }

      #player {
        height: calc(100dvh - 50px);
        max-height: calc(100dvh - 50px);
      }
    }

    /* =========================
       LANDSCAPE PHONE
       ========================= */

    @media (orientation: landscape) and (max-height: 600px) {

      .playerHeader {
        min-height: 44px;
        flex-basis: 44px;
      }

      #player {
        height: calc(100dvh - 44px);
        max-height: calc(100dvh - 44px);
      }

      #playerTitle {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📺 JE TV</h1>

    <input
      id="search"
      type="search"
      placeholder="Search channel..."
      autocomplete="off"
      enterkeyhint="search"
    >
  </header>

  <!-- =========================
       BANNER
       ========================= -->

  <section
    id="banner"
    aria-label="Featured content"
  >
    <div class="state">
      Loading...
    </div>
  </section>

  <!-- =========================
       CATEGORIES
       ========================= -->

  <nav
    id="categories"
    aria-label="Channel categories"
  ></nav>

  <!-- =========================
       CHANNELS
       ========================= -->

  <main
    id="channels"
    aria-live="polite"
  >
    <div class="state">
      Loading channels...
    </div>
  </main>

  <!-- =========================
       PLAYER
       ========================= -->

  <div
    id="playerModal"
    class="hide"
    role="dialog"
    aria-modal="true"
    aria-label="Video player"
  >

    <div class="playerHeader">

      <span id="playerTitle">
        JE TV
      </span>

      <button
        id="closePlayer"
        type="button"
        aria-label="Close player"
      >
        ✕
      </button>

    </div>

    <video
      id="player"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      x-webkit-airplay="allow"
    ></video>

  </div>

  <!-- HLS -->

  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"
  ></script>

  <!-- APP -->

  <script src="app.js"></script>

</body>
</html>
