<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#08090b">

  <meta
    name="description"
    content="JE TV - Live TV streaming platform"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>JE TV</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="site-header">

    <div class="brand">
      📺 JE TV
    </div>

    <input
      id="search"
      type="search"
      placeholder="Search channel..."
      autocomplete="off"
    >

  </header>

  <section
    id="banner"
    class="banner"
    aria-label="Featured content"
  ></section>

  <nav
    id="categories"
    class="categories"
    aria-label="Channel categories"
  ></nav>

  <main
    id="channels"
    class="channels"
    aria-live="polite"
  >
    <div class="state">
      Loading channels...
    </div>
  </main>

  <!-- PLAYER -->

  <div
    id="playerModal"
    class="player-modal hide"
    role="dialog"
    aria-modal="true"
    aria-label="Video player"
  >

    <div class="player-header">

      <span id="playerTitle">
        JE TV
      </span>

      <button
        id="closePlayer"
        type="button"
        aria-label="Close player"
      >
        ✕
      </button>

    </div>

    <div class="player-stage">

      <video
        id="player"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
      ></video>

      <div
        id="playerLoading"
        class="player-message"
      >
        Connecting...
      </div>

      <div
        id="playerError"
        class="player-message error"
        hidden
      ></div>

    </div>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"
  ></script>

  <script src="/app.js"></script>

</body>
</html>
