<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JE TV</title>


<link rel="stylesheet" href="style.css">


<!-- HLS Player -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


</head>


<body>


<header>

<img src="assets/logo.png" class="logo">

<h1>JE TV</h1>

</header>



<!-- Banner -->

<section id="banner">

<div class="loading">
Loading Banner...
</div>

</section>




<!-- Search -->

<div class="search-area">

<input 
id="search"
type="text"
placeholder="Search Channel...">

</div>




<!-- Categories -->

<div id="categories">

</div>





<!-- Channels -->

<section id="channels">

<div class="loading">
Loading Channels...
</div>

</section>






<!-- Premium -->

<button id="premiumBtn">

🔒 Premium

</button>



<div id="premiumBox" class="hide">


<h3>
Premium Access
</h3>


<input 
id="premiumPassword"
type="password"
placeholder="Password">


<button id="unlockPremium">

Unlock

</button>


</div>








<!-- Player -->

<div id="playerModal" class="hide">


<div class="player-box">


<button id="closePlayer">

✖

</button>


<h3 id="playerTitle">

Channel

</h3>


<video 
id="player"
controls
autoplay
playsinline>

</video>


</div>


</div>






<!-- Notice -->

<div id="notice">

</div>





<script src="app.js"></script>


</body>

</html>
