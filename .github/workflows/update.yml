name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Google Sheet
        run: |
          curl "${{ secrets.SHEET_URL }}" -o channels.csv

      - name: Create Playlist
        run: |
          echo "#EXTM3U" > playlist.m3u

          tail -n +2 channels.csv | while IFS=, read name group logo url
          do
            echo "#EXTINF:-1 tvg-logo=\"$logo\" group-title=\"$group\",$name" >> playlist.m3u
            echo "$url" >> playlist.m3u
          done

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update playlist" || exit 0
          git push
