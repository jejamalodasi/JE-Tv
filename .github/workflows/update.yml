name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Download Sheet
      run: |
        curl "${{ secrets.SHEET_URL }}" -o channels.csv


    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'


    - name: Create Playlist
      run: |

        python <<EOF

        import csv
        import json


        channels=[]


        with open("channels.csv",
        encoding="utf-8") as f:

            reader=csv.DictReader(f)

            for row in reader:

                if row.get("Status","Active")=="OFF":
                    continue

                channels.append(row)


        with open("playlist.json","w",
        encoding="utf-8") as f:

            json.dump(
            channels,
            f,
            indent=2,
            ensure_ascii=False
            )


        with open("playlist.m3u","w",
        encoding="utf-8") as f:

            f.write("#EXTM3U\n")

            for c in channels:

                f.write(
                f'#EXTINF:-1 tvg-logo="{c["Logo"]}" group-title="{c["Group"]}",{c["Name"]}\n'
                )

                f.write(c["URL"]+"\n")


        EOF



    - name: Save Changes
      run: |

        git config --global user.name github-actions

        git config --global user.email actions@github.com

        git add .

        git commit -m "Auto update playlist" || exit 0

        git push
