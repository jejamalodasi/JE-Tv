name: update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests openpyxl

      - name: Build playlist
        run: |
          python <<'PY'
          import pandas as pd

          df = pd.read_csv("playlist.csv").fillna("")

          required = ["Name","URL"]
          for c in required:
              if c not in df.columns:
                  raise Exception(f"Missing column: {c}")

          for c in ["Logo","Group","EPG_ID","Country","Language"]:
              if c not in df.columns:
                  df[c]=""

          out=["#EXTM3U"]
          for _,r in df.iterrows():
              out.append(
                  f'#EXTINF:-1 tvg-id="{r.EPG_ID}" tvg-logo="{r.Logo}" '
                  f'group-title="{r.Group}",{r.Name}'
              )
              out.append(str(r.URL))

          open("playlist.m3u","w",encoding="utf-8").write("\n".join(out))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u
